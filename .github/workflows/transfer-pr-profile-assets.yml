name: Transfer original PR profile assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-pr-profile-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Copy only original verified profile images from beta
        run: |
          git fetch origin feature/admin-beta-users
          git checkout origin/feature/admin-beta-users -- public/profile-verified.png public/profile-badge.png
          test -s public/profile-verified.png
          test -s public/profile-badge.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/profile-verified.png public/profile-badge.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(profile): restore original verified badges from beta"
            git push origin HEAD:main
          fi

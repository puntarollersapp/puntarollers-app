name: Beta isolation checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/functions/pr-beta-admin/**'
      - 'tests/beta-isolation.test.mjs'
      - 'package.json'
      - '.github/workflows/beta-isolation.yml'
  workflow_dispatch:
jobs:
  beta-isolation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Beta regression tests
        run: npm run test:beta

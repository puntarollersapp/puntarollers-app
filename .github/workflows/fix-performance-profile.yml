name: Fix Performance profile value

on:
  push:
    paths:
      - '.github/workflows/fix-performance-profile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact safe replacement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Admin.jsx')
          text = path.read_text(encoding='utf-8')
          old = 'En evolucion'
          new = 'En evolución'
          count = text.count(old)

          if count != 4:
              raise SystemExit(f'Safety stop: expected 4 occurrences of {old!r}, found {count}. No commit made.')

          path.write_text(text.replace(old, new), encoding='utf-8')
          print(f'Replaced {count} occurrences safely.')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "Punta Rollers Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Admin.jsx
          git rm .github/workflows/fix-performance-profile.yml
          git commit -m "fix: normalize Performance perfil_rodaje value"
          git push origin main

name: Add Clinic 2026 badge

on:
  push:
    branches:
      - feature/clinic-2026-badge

permissions:
  contents: write

jobs:
  patch-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clinic-2026-badge
          fetch-depth: 0
      - name: Add clinic badge to catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path('src/pages/Admin.jsx')
          text = admin.read_text(encoding='utf-8')
          if "title: 'Primera Clínica 2026'" not in text:
              anchor = """  {\n    title: 'Entrenador potencial',\n    image: '/insignias-pr/entrenador-potencial.png',\n    description:\n      'Demostro liderazgo, responsabilidad y capacidad para acompanar a otros.',\n  },\n]"""
              replacement = """  {\n    title: 'Entrenador potencial',\n    image: '/insignias-pr/entrenador-potencial.png',\n    description:\n      'Demostro liderazgo, responsabilidad y capacidad para acompanar a otros.',\n  },\n  {\n    title: 'Primera Clínica 2026',\n    image: '/insignias-pr/primera-clinica-2026.webp?v=1',\n    description:\n      'Completó la primera Clínica Internacional de Patinaje Punta Rollers 2026, edición septiembre, dictada por Miguel Flores.',\n  },\n]"""
              if anchor not in text:
                  raise SystemExit('No se encontró el catálogo OFFICIAL_BADGES esperado')
              admin.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          badges = Path('src/lib/badges.js')
          b = badges.read_text(encoding='utf-8')
          if "'primera clinica 2026'" not in b:
              anchor = "  'entrenador potencial': '/insignias-pr/entrenador-potencial.png',\n}"
              replacement = "  'entrenador potencial': '/insignias-pr/entrenador-potencial.png',\n  'primera clinica 2026': '/insignias-pr/primera-clinica-2026.webp?v=1',\n}"
              if anchor not in b:
                  raise SystemExit('No se encontró BADGE_IMAGES esperado')
              badges.write_text(b.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/add-clinic-badge.yml
          git config user.name "puntarollers-bot"
          git config user.email "puntarollers.app@gmail.com"
          git add src/pages/Admin.jsx src/lib/badges.js public/insignias-pr/primera-clinica-2026.webp .github/workflows/add-clinic-badge.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Primera Clínica 2026 badge"
            git push origin HEAD:feature/clinic-2026-badge
          fi

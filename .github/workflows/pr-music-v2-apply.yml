name: Apply PR Music 2.0 preview

on:
  push:
    branches:
      - pr-music-v2
    paths:
      - '.github/workflows/pr-music-v2-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: pr-music-v2
          fetch-depth: 0

      - name: Write PR Music 2.0 files
        env:
          MUSIC_GZ_B64: ""
          SQL_GZ_B64: ""
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          music = gzip.decompress(base64.b64decode(os.environ['MUSIC_GZ_B64']))
          sql = gzip.decompress(base64.b64decode(os.environ['SQL_GZ_B64']))
          Path('src/pages/Music.jsx').write_bytes(music)
          Path('PR_MUSIC_V2_SUPABASE.sql').write_bytes(sql)
          print('Music.jsx bytes:', len(music))
          print('SQL bytes:', len(sql))
          PY

      - name: Commit preview files and remove temporary workflow
        run: |
          git config user.name "Punta Rollers Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Music.jsx PR_MUSIC_V2_SUPABASE.sql
          git rm .github/workflows/pr-music-v2-apply.yml
          git commit -m "feat: redesign PR Music 2.0 preview"
          git push origin pr-music-v2

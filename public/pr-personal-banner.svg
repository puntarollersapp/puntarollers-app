<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc"><title id="title">PR Personal - Punta Rollers</title><desc id="desc">Banner deportivo para clases personalizadas de Punta Rollers.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset=".55" stop-color="#0b0b0d"/><stop offset="1" stop-color="#151515"/></linearGradient><linearGradient id="red" x1="0" x2="1"><stop stop-color="#ff6b6b"/><stop offset="1" stop-color="#ef4444"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="520" rx="34" fill="url(#bg)"/><rect width="1600" height="520" rx="34" fill="url(#grid)"/><circle cx="1370" cy="90" r="220" fill="#ef4444" opacity=".08" filter="url(#glow)"/><path d="M1020 0 1600 0 1600 520 1240 520Z" fill="#ef4444" opacity=".035"/><path d="M0 430 C250 360 350 520 650 430 S1100 360 1600 430" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2"/><g transform="translate(95 78)"><text x="0" y="38" fill="#fca5a5" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing="9">PUNTA ROLLERS · PR PERSONAL</text><text x="0" y="145" fill="#fff" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="86" font-weight="900">TU ENTRENAMIENTO.</text><text x="0" y="235" fill="url(#red)" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="86" font-weight="900">TU HORARIO.</text><text x="4" y="302" fill="#fff" opacity=".48" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Reservá tu clase. Revisá tu PR Pass. Seguí avanzando.</text><g transform="translate(4 350)"><rect width="410" height="72" rx="22" fill="#fff" opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="28" y="46" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800">NO ES SOLO PATINAR. ES PERTENECER.</text></g></g><g transform="translate(1220 122)"><circle cx="120" cy="120" r="112" fill="#ef4444" opacity=".1" stroke="#f87171" stroke-opacity=".22"/><path d="M76 60c28 10 56 8 86 1l18 54c7 22 0 40-22 53-28 16-66 20-105 7l10-31c27 8 50 7 67-1 13-6 18-14 14-25l-7-20c-27 5-54 4-78-4z" fill="#fff" opacity=".92"/><path d="M54 178h132" stroke="#f87171" stroke-width="8" stroke-linecap="round"/><circle cx="74" cy="194" r="15" fill="#fff"/><circle cx="116" cy="194" r="15" fill="#fff"/><circle cx="158" cy="194" r="15" fill="#fff"/><circle cx="200" cy="194" r="15" fill="#fff"/></g><g fill="#fff" opacity=".12"><path d="m1160 45 26 26-26 26-26-26z"/><path d="m1490 360 18 18-18 18-18-18z"/><path d="m1110 430 14 14-14 14-14-14z"/></g></svg>